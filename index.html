<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ccff02" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="ХАСЛ — брендовая одежда и обувь. Чем больше сумма корзины, тем выше скидка — до 50%." />
    <title>ХАСЛ — Скидка до 50%</title>
    <script>
      (() => {
        const basePath = location.hostname.endsWith(".github.io") ? `${location.pathname.split("/").slice(0, 2).join("/")}/` : "/";
        const base = document.createElement("base");
        base.href = basePath;
        document.head.append(base);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="./images/hasle_logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <button id="page-scroll-top" class="page-scroll-top" type="button" aria-label="Наверх" title="Наверх">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
    </button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
